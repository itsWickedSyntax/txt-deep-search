[package]
name = "txt-deep-search"
version = "1.0.0"
edition = "2021"
description = "A high-performance CLI and GUI tool for deep-searching .txt files with indexing support"
license = "MIT"

[[bin]]
name = "txt-deep-search"
path = "src/main.rs"

[[bin]]
name = "txt-deep-search-gui"
path = "src/bin/txt-deep-search-gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
regex = "1"
colored = "2"
indicatif = { version = "0.17", features = ["rayon"] }
walkdir = "2"
memmap2 = "0.9"
csv = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
atty = "0.2"

# GUI dependencies (optional, behind 'gui' feature)
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
